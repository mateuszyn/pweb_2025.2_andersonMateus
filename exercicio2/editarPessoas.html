<body>

        <ul> 
            <li> <a href = "index.html"> Início </a></li>
            <li> <a href = "adicionarPessoas.html"> Adicionar Pessoas </a></li>
            <li> <a class = "ativo" href = "listarPessoas.html"> Listar Pessoas </a></li>

            <li> <a href = "sobre.html"> Sobre o Site </a></li>

    <h1 class = "titulo-recuado"> Formulário para editar pessoas: </h1>

    <form class = "meu-formulario" action = "editadaComSucesso.html" method = "post">
        <div class = "grupo-formulario">
            <label for = "nome"> Seu nomezinho*: </label>
            <input type = "text" id = "nome" name = "nome" placeholder = "Nome Completo" required>
            </div>

            <div class = "grupo-formulario">
                <label for = "email"> E-mail*: </label> 
                <input type = "email" id = "email" name = "email" placeholder = "nome@dominio.com" required>
                <small class = "texto-ajuda"> Nunca divulgaremos :) </small>
            </div>

            <div class = "grupo-formulario"> 
                <label for = "nascimento"> Data de Nascimento*: </label>
                <input type = "date" id = "nascimento" name = "nascimento" required>
            </div>

            <div class = "grupo-formulario">
                <label> Gênero*: </label> 
                <div class = "opcoes-radio"> 
                    <label> 
                        <input type = "radio" name = "genero" value = "masculino" required> Masculino
                    </label>
                    <label> 
                        <input type = "radio" name = "genero" value = "feminino" required> Feminino
                    </label>
                    <label> 
                        <input type = "radio" name = "genero" value = "nao_informar" required> Não Informar
                    </label>
                </div>
            </div>

            <div class = "grupo-botoes">
                <button type = "submit" class = "btn btn-adicionar"> Adicionar </button>
                <button type = "reset" class = "btn btn-limpar"> Limpar </button>
            </div>

            <p class = "campo-obrigatorio-aviso">  *Campo Obrigatório </p>

        </form>
</body>
</html>
