<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Beba Notícias</title>

    <link rel = "stylesheet" th:href = "@{css/estilos.css}"> 

    <link rel="icon" th:href= "@{assets/favicon.ico}">
    
</head>
<body>
    <nav> 
        <ul> 
            <li> <a th:href = "@{/index}"> Início </a></li>
            <li> <a class = "ativo" th:href = "@{/adicionarPessoas}"> Adicionar Pessoas </a></li>
            <li> <a th:href = "@{/listarPessoas}"> Listar Pessoas </a></li>
            <li class = "empurrar-direita"> 
                <a> Contato </a></li>
            <li> <a th:href = "@{/sobre}"> Sobre o Site </a></li>
            <li> <a th:href = "@{/noticias}"> Notícias </a></li>
        </ul>
    </nav>
    <h1 class = "texto-recuado"> Formulário para adicionar pessoas: </h1>

    <form class = "meu-formulario" th:action = "@{/adicionarPessoa}" method = "post" th:object = "${pessoa}">
        <div class = "grupo-formulario">
            <label for = "nome"> Seu nomezinho*: </label>
            <input type = "text" id = "nome" placeholder = "Nome Completo" required th:field = "*{nome}">
            </div>

            <div class = "grupo-formulario">
                <label for = "email"> E-mail*: </label> 
                <input type = "email" id = "email" placeholder = "nome@dominio.com" required th:field = "*{email}">
                <small class = "texto-ajuda"> Nunca divulgaremos :) </small>
            </div>

            <div class = "grupo-formulario"> 
                <label for = "nascimento"> Data de Nascimento*: </label>
                <input type = "date" id = "nascimento" required th:field = "*{dataNascimento}">
            </div>

            <div class = "grupo-linha-inteira">
                <label> Gênero*: </label> 
                <div class = "opcoes-radio"> 
                    <label> 
                        <input type = "radio" value = "Masculino" required th:field = "*{genero}"> Masculino
                    </label>
                    <label> 
                        <input type = "radio" value = "Feminino" required th:field = "*{genero}"> Feminino
                    </label>
                    <label> 
                        <input type = "radio" value = "Não Informado" required th:field = "*{genero}"> Não Informar
                    </label>
                </div>
            </div>

            <div class = "grupo-botoes">
                <button type = "submit" class = "btn btn-adicionar"> Adicionar </button>
                <button type = "reset" class = "btn btn-limpar"> Limpar </button>
            </div>

            <p class = "campo-obrigatorio-aviso">  *Campo Obrigatório </p>

        </form>
</body>
</html>
