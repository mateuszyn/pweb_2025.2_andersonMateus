<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org" data-theme="light">
<head>
    <meta charset="UTF-8">
    <title>Lista de Clientes</title>
    <link rel="stylesheet" th:href = "@{/estilos.css}">
    <link rel="icon" th:href="@{/favicon.ico}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <h1 class="header-purpurina">Lista de Produtos</h1>
    <form action="/listarProdutos" method="GET" class="barra-busca-form">

        <div class="busca-input-wrapper">
            
            <input type="text" 
                name="busca" 
                placeholder="Buscar por Marca, Metal, Gema, ou Quilates..."
                th:value="${busca}" 
                class="input-busca">
            
            <button type="submit" class="icone-busca" title="Buscar">
                <i class="fas fa-search"></i>
            </button>
            
        </div>
        
        <a th:href="@{/listarProdutos}" class="link-limpar-busca">Limpar Busca</a>

    </form>
    <table class="tabela">
        </table>
        
    <table class="tabela">
        <thead>
            <tr>
                <th>ID</th>
                <th>Marca</th>
                <th>Tipo Metal</th>
                <th>Gemas</th>
                <th>Peso(g)</th>
                <th>Quilates</th>
                <th>Dimensões</th>
                <th>Preço Compra</th>
                <th>Preço Venda</th>
                <th>Data Cadastro</th>
                <th>Editar</th>
                <th>Excluir</th>
            </tr>
        </thead>
    <tbody>
        <tr th:each="prod : ${produtos}">
            <td th:text="${prod.id}">1</td>
            <td th:text="${prod.marca}">Marca</td>
            <td th:text="${prod.tipoDeMetal}">Ouro</td>

            <td th:text="${prod.gemas}">Gemas</td>
            <td th:text="${prod.pesoEmGramas}">Peso</td>
            <td th:text="${prod.quilates}">Quilates</td>
            <td th:text="${prod.dimensoes}">Dimensões</td>
            <td th:text="${#numbers.formatCurrency(prod.precoDeCompra)}">R$ Compra</td>
            <td th:text="${#numbers.formatCurrency(prod.precoDeVenda)}">R$ Venda</td>
            <td th:text="${#temporals.format(prod.dataDeCadastro, 'dd/MM/yyyy')}">Data</td>

            <td>
                <a class="link-acao" th:href="@{'/editarProduto/' + ${prod.id}}">Editar</a>
            </td>
            <td> <a class="link-acao" th:href="@{'/excluirProduto/' + ${prod.id}}">Excluir</a> </td>
        </tr>
    </tbody>
    </table>

    <div class="grupo-icones-acao">

        <a th:href="@{/}" class="btn-icone-grande" title="Voltar para o Início">
            <i class="fas fa-arrow-left"></i>
            <span class="sr-only">Voltar para o Início</span> 
        </a>
         
        <a th:href="@{/adicionarProduto}" class="btn-icone-grande" title="Adicionar Novo Produto">
            <i class="fas fa-plus-square"></i> <span class="sr-only">Adicionar Novo Produto</span> 
        </a>

    </div>

</body>
</html>
