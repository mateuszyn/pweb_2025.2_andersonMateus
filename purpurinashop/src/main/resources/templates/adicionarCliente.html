<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Adicionar Cliente</title>
    <link rel="stylesheet" th:href="@{/estilos.css}">
</head>
<body>

    <h1>Adicionar Novo Cliente</h1>

    <form class="meu-formulario" th:action="@{/adicionarCliente}" method="POST" th:object="${cliente}">

        <div class="grupo-formulario">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" th:field="*{nome}" required>
        </div>

        <div class="grupo-formulario">
            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" th:field="*{cpf}" required>
        </div>

        <div class="grupo-formulario">
            <label for="email">Email:</label>
            <input type="email" id="email" th:field="*{email}">
        </div>

        <div class="grupo-formulario">
            <label for="dataNascimento">Data de Nascimento:</label>
            <input type="date" id="dataNascimento" th:field="*{dataNascimento}">
        </div>

        <div class="grupo-botoes">
            <button type="submit" class="btn btn-adicionar">Adicionar</button>
        </div>
    </form>

    <br>
    <a th:href="@{/clientes}">Voltar para a Lista</a>

</body>
</html>
