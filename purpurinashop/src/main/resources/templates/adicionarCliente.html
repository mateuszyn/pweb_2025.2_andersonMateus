<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-theme="light">
<head>
    <meta charset="UTF-8">
    <title>PurpurinaShop - Início</title>
    <link rel="stylesheet" th:href="@{/estilos.css}">
    <link rel="icon" th:href="@{/favicon.ico}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header class="header-purpurina">
        <h1>Adicionar Novo Cliente</h1>
    </header>

        <form class="formulario-cliente" th:action="@{/adicionarCliente}" method="POST" th:object="${cliente}">
        
        <fieldset class="secao-formulario card-borda">
            <legend class="titulo-purpurina">Informações Essenciais</legend>
            
            <div class="grid-formulario">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" th:field="*{nome}" required>
            </div>

            <div class="grid-formulario">
                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" th:field="*{cpf}" required>
            </div>
            
            <div class="grid-formulario">
                <label for="dataNascimento">Data de Nascimento:</label>
                <input type="date" id="dataNascimento" th:field="*{dataNascimento}">
            </div>

        </fieldset>

        <fieldset class="secao-formulario card-borda">
            <legend class="titulo-purpurina">Contato e Gênero</legend>

            <label for="email">Email:</label>
            <input type="email" id="email" th:field="*{email}">

            <label for="telefone">Telefone (com DDD):</label>
            <input type="text" id="telefone" th:field="*{telefone}">

            <div class="grupo-radio-tematico">
                <label>Gênero:</label>
                <div class="opcoes-radio-tematico">
                    <label><input type="radio" value="Feminino" th:field="*{genero}"> Feminino</label>
                    <label><input type="radio" value="Masculino" th:field="*{genero}"> Masculino</label>
                    <label><input type="radio" value="Não Informado" th:field="*{genero}"> Não Informado</label>
                    <label><input type="radio" value="Indefinido" th:field="*{genero}"> Indefinido</label>
                </div>
            </div>

        </fieldset>

        <fieldset class="secao-formulario card-borda">
            <legend class="titulo-purpurina">Endereço</legend>
            
            <div class="grid-formulario duas-colunas">
                <label for="rua">Rua:</label>
                <input type="text" id="rua" th:field="*{rua}">

                <label for="numero">Número:</label>
                <input type="text" id="numero" th:field="*{numero}">
            </div>

            <div class="grid-formulario">
                <label for="bairro">Bairro:</label>
                <input type="text" id="bairro" th:field="*{bairro}">
            </div>

            <div class="grid-formulario">
                <label for="cidade">Cidade:</label>
                <input type="text" id="cidade" th:field="*{cidade}">
            </div>
        </fieldset>


                <div class="grupo-botoes-centralizado">
            <button type="submit" class="btn-purpura btn-grande">Adicionar Cliente</button>
        </div>
    </form>

    <br>
        <div class="navegacao-icones">
            
            <a th:href="@{/listarClientes}" class="btn-icone-grande" title="Voltar para a Lista de Clientes">
                <i class="fas fa-arrow-left"></i>
            </a>

            <a th:href="@{/}" class="btn-icone-grande" title="Tela Inicial">
                <i class="fas fa-home"></i>
            </a>
            
        </div>

</body>
</html>
