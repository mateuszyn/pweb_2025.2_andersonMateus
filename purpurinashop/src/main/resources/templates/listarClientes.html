<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org" data-theme="light">
<head>
    <meta charset="UTF-8">
    <title>Lista de Clientes</title>
    <link rel="stylesheet" th:href = "@{/estilos.css}">
    <link rel="icon" th:href="@{/favicon.ico}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

</head>
<body>
    <h1 class="header-purpurina">Lista de Clientes</h1>

    <table class="tabela">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>CPF</th>
                <th>Email</th>
                <th> Data de Nascimento</th>
                <th>Gênero</th> 
                <th>Telefone</th> 
                <th>Endereço</th>
                <th> Remover </th>
                <th> Editar </th>
             </tr>
            </tr>
        </thead>
        <tbody>
            <tr th:each="cli : ${clientes}">
                <td th:text="${cli.id}">1</td>
                <td th:text="${cli.nome}">Nome do Cliente</td>
                <td th:text="${cli.cpf}">123.456.789-00</td>
                <td th:text="${cli.email}">email@cliente.com</td>
                <td th:text="${cli.dataNascimento}">20/02/2004</td>
                <td th:text="${cli.genero}">Gênero</td>
                <td th:text="${cli.telefone}">Telefone</td>

                <td th:text="${cli.rua + ', ' + cli.numero + ' - ' + cli.bairro + ', ' + cli.cidade}">
                    Endereço Completo
                </td>


                <td><a class="link-acao" th:href="@{'/excluirCliente/' + ${cli.id}}">Remover</a></td>
                <td><a class="link-acao" th:href="@{'/editarCliente/' + ${cli.id}}">Editar</a></td>
                
            </tr>
        </tbody>
    </table>
    
    <div class="grupo-icones-acao">
        <a th:href="@{/}" class="btn-icone-grande" title="Voltar para o Início">
            <i class="fas fa-arrow-left"></i>
            <span class="sr-only">Voltar para o Início</span> 
        </a>

        <a th:href="@{/adicionarCliente}" class="btn-icone-grande" title="Adicionar Novo Cliente">
            <i class="fas fa-user-plus"></i>
            <span class="sr-only">Adicionar Novo Cliente</span> 
        </a>

        <a th:href="@{/listarDependentes}" class="btn-icone-grande" title="Ver Dependentes">
            <i class="fas fa-users"></i>
            <span class="sr-only">Ver Dependentes</span> 
        </a>

    </div>
 
</body>
</html>
