<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Cliente</title>
    <link rel="stylesheet" th:href="@{/estilos.css}">
</head>
<body>

    <h1>Editar Cliente</h1>

    <form class="meu-formulario" th:action="@{/adicionarCliente}" method="POST" th:object="${cliente}">

        <div class="grupo-formulario">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" th:field="*{nome}" required>
            <input type="hidden" th:field="*{id}" />
        </div>

        <div class="grupo-formulario">
            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" th:field="*{cpf}" required>
        </div>

        <div class="grupo-formulario">
            <label for="email">Email:</label>
            <input type="email" id="email" th:field="*{email}">
        </div>

        <div class="grupo-formulario">
            <label for="dataNascimento">Data de Nascimento:</label>
            <input type="date" id="dataNascimento" th:field="*{dataNascimento}">
        </div>

    <div class="grupo-formulario">
        <label>Gênero:</label>
        <div class="opcoes-radio">
            <label><input type="radio" value="Feminino" th:field="*{genero}"> Feminino</label>
            <label><input type="radio" value="Masculino" th:field="*{genero}"> Masculino</label>
            <label><input type="radio" value="Não Informado" th:field="*{genero}"> Não Informado</label>
            <label><input type="radio" value="Indefinido" th:field="*{genero}"> Indefinido</label>
        </div>
    </div>

    <div class="grupo-formulario">
        <label for="telefone">Telefone (com DDD):</label>
        <input type="text" id="telefone" th:field="*{telefone}">
    </div>

    <div class="grupo-formulario">
        <label for="rua">Rua:</label>
        <input type="text" id="rua" th:field="*{rua}">
    </div>

    <div class="grupo-formulario">
        <label for="bairro">Bairro:</label>
        <input type="text" id="bairro" th:field="*{bairro}">
    </div>

    <div class="grupo-formulario">
        <label for="numero">Número:</label>
        <input type="text" id="numero" th:field="*{numero}">
    </div>

    <div class="grupo-formulario">
        <label for="cidade">Cidade:</label>
        <input type="text" id="cidade" th:field="*{cidade}">
    </div>

        <div class="grupo-botoes">
            <button type="submit" class="btn btn-adicionar">Salvar Alterações</button>
        </div>
    </form>

    <br>
    <a th:href="@{/clientes}">Voltar para a Lista</a>

</body>
</html>
