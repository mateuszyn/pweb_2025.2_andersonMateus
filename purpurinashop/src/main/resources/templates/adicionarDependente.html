<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Adicionar Dependente</title>
    <link rel="stylesheet" th:href="@{/estilos.css}">
    <link rel="icon" th:href="@{/favicon.ico}">
</head>
<body>

    <h1>Adicionar Novo Dependente</h1>

    <form class="meu-formulario" th:action="@{/adicionarDependente}" method="POST" th:object="${dependente}">

        <div class="grupo-formulario">
            <label for="nome">Nome do Dependente:</label>
            <input type="text" id="nome" th:field="*{nome}" required>
        </div>

        <div class="grupo-formulario">
            <label for="dataNascimento">Data de Nascimento:</label>
            <input type="date" id="dataNascimento" th:field="*{dataNascimento}" required>
        </div>

        <div class="grupo-formulario">
            <label>Gênero:</label>
            <div class="opcoes-radio">
                <label><input type="radio" value="Feminino" th:field="*{genero}"> Feminino</label>
                <label><input type="radio" value="Masculino" th:field="*{genero}"> Masculino</label>
                <label><input type="radio" value="Não Informado" th:field="*{genero}"> Não Informado</label>
                <label><input type="radio" value="Indefinido" th:field="*{genero}"> Indefinido</label>
            </div>
        </div>

        <div class="grupo-formulario">
            <label for="cliente">Cliente (Responsável):</label>
            <select id="cliente" th:field="*{cliente}" required>
                <option value="">-- Selecione um Cliente --</option>
                <option th:each="cli : ${clientes}" 
                        th:value="${cli.id}" 
                        th:text="${cli.nome + ' (CPF: ' + cli.cpf + ')'}">
                    Nome do Cliente (CPF)
                </option>
            </select>
        </div>

        <div class="grupo-botoes">
            <button type="submit" class="btn btn-adicionar">Adicionar</button>
        </div>
    </form>

    <br>
    <a class = "link-acao" th:href="@{/listarDependentes}">Voltar para a Lista de Dependentes</a>

</body>
</html>
